name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Build web UI
        run: pnpm --filter @amem/web build

      - name: Smoke test
        run: pnpm test

      - name: Assemble release archive
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          ARCHIVE="amem-${TAG}.tar.gz"
          STAGE="amem-${TAG}"
          mkdir -p "${STAGE}/docker" "${STAGE}/docs" "${STAGE}/apps/web" "${STAGE}/packages"
          cp docker/Dockerfile docker/docker-compose.yml "${STAGE}/docker/"
          cp -R docs/. "${STAGE}/docs/"
          cp README.md CHANGELOG.md LICENSE SECURITY.md "${STAGE}/"
          cp -R apps/web/dist/. "${STAGE}/apps/web/dist/"
          for pkg in server mcp db cli; do
            if [ -d "packages/${pkg}/dist" ]; then
              mkdir -p "${STAGE}/packages/${pkg}"
              cp -R "packages/${pkg}/dist" "${STAGE}/packages/${pkg}/dist"
            fi
          done
          tar -czf "${ARCHIVE}" "${STAGE}"
          rm -rf "${STAGE}"
          echo "archive=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Set up QEMU (cross-arch build)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME}
            ghcr.io/${{ github.repository }}:latest

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --generate-notes \
            --title "Amem ${GITHUB_REF_NAME}" \
            "./${archive}"
